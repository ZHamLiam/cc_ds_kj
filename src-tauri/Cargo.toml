[package]
name = "cc_ds_kj"
version = "0.2.1"
description = "跨境电商助手"
authors = [""]
edition = "2021"

[lib]
name = "cc_ds_kj_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
enigo = "0.3"
